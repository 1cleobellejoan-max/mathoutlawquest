<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Math Outlaw Quest 🐱</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>"
    />
  </head>
  <body>
    <div id="app">
      <!-- ===== STATUS BAR ===== -->
      <div id="statusBar">
        <!-- Notification Bell -->
        <button
          class="status-btn notif-bell-btn"
          id="notificationBell"
          onclick="toggleNotificationPanel()"
        >
          🔔
          <span id="notifBadge" class="notif-badge" style="display: none"
            >!</span
          >
        </button>
        <button class="status-btn" onclick="showScreen('dashboard')">📊</button>
        <button class="gear-btn" id="gearBtn" onclick="toggleDebugPanel()">
          ⚙️
        </button>
      </div>

      <!-- ===== NOTIFICATION CONTAINER (toast messages) ===== -->
      <div id="notificationContainer"></div>

      <!-- ===== NOTIFICATION PANEL (dropdown) ===== -->
      <div id="notificationPanel" class="notif-panel" style="display: none">
        <div class="notif-panel-header">
          <span>🔔 Notifications</span>
          <button class="notif-panel-close" onclick="toggleNotificationPanel()">
            ✕
          </button>
        </div>
        <div id="notifPanelContent" class="notif-panel-content">
          <!-- Generated by JavaScript -->
        </div>
      </div>

      <!-- ===== START SCREEN ===== -->
      <div id="start" class="screen active">
        <div class="start-emoji">🐱</div>
        <h1 class="start-title">Math Outlaw<br />Quest</h1>
        <p class="start-subtitle">
          Learn math through adventure!<br />Practice and unlock new worlds!
        </p>
        <button class="start-btn" onclick="showScreen('map')">
          ▶ Start Adventure
        </button>
        <button
          class="start-btn start-btn-secondary"
          onclick="showScreen('dashboard')"
        >
          📊 View Progress
        </button>
      </div>

      <!-- ===== MAP SCREEN ===== -->
      <div id="map" class="screen">
        <div class="map-header">
          <h2>🗺️ World Map</h2>
          <p>Choose a world to practice!</p>
        </div>
        <div id="mapContainer">
          <!-- Generated by JavaScript -->
        </div>
      </div>

      <!-- ===== GAME SCREEN ===== -->
      <div id="game" class="screen">
        <!-- Timer Display -->
        <div id="timerContainer" class="timer-container">
          <div class="timer-bar-outer">
            <div class="timer-bar-fill" id="timerFill"></div>
          </div>
          <div class="timer-text" id="timerDisplay">0:30</div>
        </div>

        <div class="question-card">
          <div id="questionContainer">
            <!-- Generated by JavaScript -->
          </div>

          <!-- Math Work Area -->
          <div class="work-area-container">
            <div class="work-area-label">📝 Work Area</div>
            <canvas id="workAreaCanvas" class="work-area-canvas"></canvas>
            <div class="work-area-controls">
              <button class="wa-btn" id="workUndoBtn" onclick="undoStroke()">
                ↩ Undo
              </button>
              <button class="wa-btn wa-btn-danger" onclick="clearCanvas()">
                🗑️ Clear
              </button>
            </div>
          </div>

          <div class="answer-area">
            <input
              type="text"
              id="answerInput"
              class="answer-input"
              placeholder="Type your answer..."
              inputmode="numeric"
              autocomplete="off"
            />
            <button id="helpBtn" class="help-btn" onclick="showHelp()">
              💡 I Need Help
            </button>
            <button id="submitBtn" class="submit-btn" onclick="submitAnswer()">
              Submit
            </button>
          </div>

          <div id="feedback" class="feedback"></div>
          <div id="hintBox" class="hint-box"></div>

          <!-- Retry Container -->
          <div id="retryContainer" class="retry-container"></div>
        </div>

        <!-- Support Board -->
        <div id="supportBoardContainer" class="support-board-container"></div>

        <!-- Read-Aloud Container (Reading Trail only) -->
        <div id="readAloudContainer" class="read-aloud-container"></div>

        <div class="game-nav">
          <button class="game-nav-btn" onclick="showScreen('map')">
            🗺️ Map
          </button>
          <button class="game-nav-btn" onclick="showScreen('dashboard')">
            📊 Progress
          </button>
        </div>
      </div>

      <!-- ===== DASHBOARD SCREEN ===== -->
      <div id="dashboard" class="screen">
        <div class="dashboard-header">
          <h2>📊 Progress Dashboard</h2>
        </div>
        <div id="dashboardContent">
          <!-- Generated by JavaScript -->
        </div>
        <div style="margin-top: 15px; text-align: center">
          <button
            class="game-nav-btn"
            onclick="showScreen('map')"
            style="
              background: rgba(255, 255, 255, 0.2);
              color: white;
              border: none;
              padding: 12px 30px;
              border-radius: 12px;
              font-size: 1rem;
              font-weight: 600;
              cursor: pointer;
            "
          >
            🗺️ Back to Map
          </button>
        </div>
      </div>

      <!-- ===== DEBUG PANEL ===== -->
      <div id="debugPanel" class="debug-panel" style="display: none">
        <div class="debug-panel-header">
          <h3>🔧 Debug Settings</h3>
          <button class="debug-close-btn" onclick="toggleDebugPanel()">
            ✕
          </button>
        </div>
        <div class="debug-panel-content">
          <!-- Support Board Controls -->
          <div class="debug-section">
            <h4>📋 Support Board</h4>
            <div class="debug-btn-row">
              <button
                class="debug-toggle-btn"
                id="debugSupportOn"
                onclick="debugSupportForce(true)"
              >
                Force ON
              </button>
              <button
                class="debug-toggle-btn"
                id="debugSupportOff"
                onclick="debugSupportForce(false)"
              >
                Force OFF
              </button>
              <button class="debug-toggle-btn" onclick="debugSupportAuto()">
                Auto (default)
              </button>
            </div>
          </div>

          <!-- Difficulty Unlock Controls -->
          <div class="debug-section">
            <h4>🔓 Difficulty Unlock</h4>
            <div class="debug-btn-row">
              <button class="debug-action-btn" onclick="debugUnlockAllWorlds()">
                Unlock All Maps
              </button>
              <button
                class="debug-action-btn debug-action-danger"
                onclick="debugLockAllWorlds()"
              >
                Lock Progression
              </button>
            </div>
          </div>

          <!-- Timer Controls -->
          <div class="debug-section">
            <h4>⏱️ Timer</h4>
            <div class="debug-btn-row">
              <button
                class="debug-toggle-btn"
                id="debugTimerOn"
                onclick="debugTimerToggle(true)"
              >
                Timer ON
              </button>
              <button
                class="debug-toggle-btn"
                id="debugTimerOff"
                onclick="debugTimerToggle(false)"
              >
                Timer OFF
              </button>
            </div>
          </div>

          <!-- Reading Features Controls -->
          <div class="debug-section">
            <h4>📖 Reading Features</h4>
            <div class="debug-btn-row">
              <button
                class="debug-toggle-btn"
                id="debugVocabOn"
                onclick="debugVocabToggle(true)"
              >
                Enable Vocab Highlights
              </button>
              <button
                class="debug-toggle-btn"
                id="debugVocabOff"
                onclick="debugVocabToggle(false)"
              >
                Disable Vocab Highlights
              </button>
            </div>
            <div class="debug-btn-row">
              <button
                class="debug-toggle-btn"
                id="debugReadOn"
                onclick="debugReadToggle(true)"
              >
                Enable Read Aloud
              </button>
              <button
                class="debug-toggle-btn"
                id="debugReadOff"
                onclick="debugReadToggle(false)"
              >
                Disable Read Aloud
              </button>
            </div>
          </div>

          <!-- Drawing Controls -->
          <div class="debug-section">
            <h4>✏️ Drawing</h4>
            <div class="debug-btn-row">
              <button
                class="debug-toggle-btn"
                id="debugDrawOn"
                onclick="debugDrawToggle(true)"
              >
                Enable Writing Layer
              </button>
              <button
                class="debug-toggle-btn"
                id="debugDrawOff"
                onclick="debugDrawToggle(false)"
              >
                Disable Writing Layer
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== DEBUG MODE LABEL ===== -->
      <div id="debugModeLabel" class="debug-mode-label" style="display: none">
        DEBUG MODE
      </div>

      <!-- ===== THEME DECORATIONS CONTAINER ===== -->
      <div id="themeDecorations" class="theme-decorations"></div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/gameData.js"></script>
    <script src="js/handwriting.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
