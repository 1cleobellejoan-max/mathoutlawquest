<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Math Outlaw Quest 🐱</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>"
    />
  </head>
  <body>
    <div id="app">
      <!-- ===== STATUS BAR ===== -->
      <div id="statusBar">
        <span class="xp-display" id="xpDisplay">⭐ 0 XP</span>
        <div class="xp-bar-outer">
          <div class="xp-bar-fill" id="xpBarFill"></div>
        </div>
        <button class="status-btn" onclick="showScreen('dashboard')">📊</button>
      </div>

      <!-- ===== NOTIFICATION CONTAINER ===== -->
      <div id="notificationContainer"></div>

      <!-- ===== START SCREEN ===== -->
      <div id="start" class="screen active">
        <div class="start-emoji">🐱</div>
        <h1 class="start-title">Math Outlaw<br />Quest</h1>
        <p class="start-subtitle">
          Learn math through adventure!<br />Practice, earn XP, and unlock new
          worlds!
        </p>
        <button class="start-btn" onclick="showScreen('map')">
          ▶ Start Adventure
        </button>
        <button
          class="start-btn start-btn-secondary"
          onclick="showScreen('dashboard')"
        >
          📊 View Progress
        </button>
      </div>

      <!-- ===== MAP SCREEN ===== -->
      <div id="map" class="screen">
        <div class="map-header">
          <h2>🗺️ World Map</h2>
          <p>Choose a world to practice!</p>
        </div>
        <div id="mapContainer">
          <!-- Generated by JavaScript -->
        </div>
      </div>

      <!-- ===== GAME SCREEN ===== -->
      <div id="game" class="screen">
        <!-- Timer Display -->
        <div id="timerContainer" class="timer-container">
          <div class="timer-bar-outer">
            <div class="timer-bar-fill" id="timerFill"></div>
          </div>
          <div class="timer-text" id="timerDisplay">0:30</div>
        </div>

        <!-- Chain Display -->
        <div id="chainDisplay" class="chain-display"></div>

        <div class="question-card">
          <div id="questionContainer">
            <!-- Generated by JavaScript -->
          </div>

          <!-- Handwriting Canvas -->
          <div class="handwriting-area">
            <canvas id="handwritingCanvas" class="handwriting-canvas"></canvas>
            <div
              id="handwritingControls"
              class="handwriting-controls"
              style="display: none"
            >
              <button class="hw-btn" id="undoBtn" onclick="undoStroke()">
                ↩ Undo
              </button>
              <button class="hw-btn" id="eraserBtn" onclick="toggleEraser()">
                🧹 Eraser
              </button>
              <button class="hw-btn hw-btn-danger" onclick="clearCanvas()">
                🗑️ Clear
              </button>
            </div>
          </div>

          <div class="answer-area">
            <input
              type="text"
              id="answerInput"
              class="answer-input"
              placeholder="Type your answer..."
              inputmode="numeric"
              autocomplete="off"
            />
            <button id="submitBtn" class="submit-btn" onclick="submitAnswer()">
              Submit
            </button>
          </div>

          <!-- Handwriting Toggle -->
          <button class="hw-toggle-btn" onclick="toggleHandwriting()">
            ✏️ Write on Screen
          </button>

          <div id="feedback" class="feedback"></div>
          <div id="hintBox" class="hint-box"></div>

          <!-- Retry Container -->
          <div id="retryContainer" class="retry-container"></div>
        </div>

        <!-- Support Board -->
        <div id="supportBoardContainer" class="support-board-container"></div>

        <!-- Read-Aloud Container -->
        <div id="readAloudContainer" class="read-aloud-container">
          <button
            class="read-aloud-btn"
            id="recordBtn"
            onclick="toggleRecording()"
          >
            🎤 Record
          </button>
          <button
            class="read-aloud-btn"
            id="playbackBtn"
            onclick="playRecording()"
            style="display: none"
          >
            ▶️ Play
          </button>
          <button
            class="read-aloud-btn read-aloud-delete"
            id="deleteBtn"
            onclick="deleteRecording()"
            style="display: none"
          >
            🗑️ Delete
          </button>
        </div>

        <div class="game-nav">
          <button class="game-nav-btn" onclick="showScreen('map')">
            🗺️ Map
          </button>
          <button class="game-nav-btn" onclick="showScreen('dashboard')">
            📊 Progress
          </button>
        </div>
      </div>

      <!-- ===== DASHBOARD SCREEN ===== -->
      <div id="dashboard" class="screen">
        <div class="dashboard-header">
          <h2>📊 Progress Dashboard</h2>
        </div>
        <div id="dashboardContent">
          <!-- Generated by JavaScript -->
        </div>
        <div style="margin-top: 15px; text-align: center">
          <button
            class="game-nav-btn"
            onclick="showScreen('map')"
            style="
              background: rgba(255, 255, 255, 0.2);
              color: white;
              border: none;
              padding: 12px 30px;
              border-radius: 12px;
              font-size: 1rem;
              font-weight: 600;
              cursor: pointer;
            "
          >
            🗺️ Back to Map
          </button>
        </div>
      </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="js/gameData.js"></script>
    <script src="js/handwriting.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
